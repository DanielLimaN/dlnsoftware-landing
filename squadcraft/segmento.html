<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/dln-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12B86B" />
    <!-- Template for /squadcraft/<slug>: vite.segmentos.ts fills the head and the slug from src/content/segmentos.ts. -->
    <!--segmento:head-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonts load without blocking the first paint (most visits come from Instagram on mobile data). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"></noscript>
  </head>
  <body>
    <div id="root" data-segmento="%SEGMENTO_SLUG%"></div>
    <script type="module" src="/src/squadcraft/segmentos/main.tsx"></script>
  </body>
</html>
